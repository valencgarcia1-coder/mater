[project]
name = "mater-detector"
version = "0.1.0"
description = "Camera-based vehicle detection worker for Mater (entry/exit + occupancy)"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.0",
    "supervision>=0.20,<0.30",  # ByteTrack is deprecated and slated for removal in 0.30
    "opencv-python>=4.8",
    "yt-dlp>=2024.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["detector*"]
